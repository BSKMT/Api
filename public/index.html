<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSKMT API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .status {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 8px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px 0; font-weight: 600; }
    p { margin: 0; color: #a1a1aa; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="status"></span>BSKMT API</h1>
    <p>Todos los sistemas operando con normalidad.</p>
  </div>
</body>
</html>
